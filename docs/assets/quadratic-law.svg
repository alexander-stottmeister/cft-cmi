<text x="382.00" y="540.00" class="lab" text-anchor="middle">ζ   (corner strength ζ = as/(a+L), dimensionless)</text>
<text x="24.00" y="560.00" class="note" text-anchor="start">Measured range ζ = 0.00833 to 17.067. At small ζ the error bracket is [window value, + tail estimate ζ²/(15κ_c²)]; only its lower end is proved.</text>
<text x="24.00" y="577.00" class="note" text-anchor="start">At large ζ that tail is not valid, so the bracket is [Φ at the largest κ_c, Φ∞]; Φ∞ is an extrapolation, not a bound.</text>
<text x="24.00" y="594.00" class="note" text-anchor="start">The widest bracket is at ζ = 17.067: [0.05739, 0.06412], and the best estimate quoted there is 0.0641 ± 0.0043.</text>
<text x="24.00" y="611.00" class="note" text-anchor="start">The local log-slope d log Φ / d log ζ falls from 1.29 at ζ = 1.067 to 0.69 at ζ = 17.067: the ζ² law is a ζ → 0 statement, not a global one.</text>
</svg>
