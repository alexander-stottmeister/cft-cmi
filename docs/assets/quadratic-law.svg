<text x="24.00" y="570.00" class="note" text-anchor="start">Measured range ζ = 0.00833 to 17.067. The small-ζ window values are rigorous lower bounds and the tail correction is added; at large ζ that tail is not valid, so the bracket is [Φ at κᶜ(max), Φ∞].</text>
<text x="24.00" y="588.00" class="note" text-anchor="start">The local log-slope d log Φ / d log ζ falls from 1.29 at ζ = 1.067 to 0.69 at ζ = 17.067 (fidelity_table_largezeta.tex): the ζ² law is a ζ → 0 statement, not a global one.</text>
