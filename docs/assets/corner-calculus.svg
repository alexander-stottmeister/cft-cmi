text{fill:#1f2328;}.sub,.tick,.note{fill:#57606a;}.axis{stroke:#1f2328;}.grid,.frame{stroke:#d0d7de;}.soft{fill:#eaeef2;}.mk-ink{fill:#1f2328;}.s1{stroke:#0550ae;} .f1{fill:#0550ae;} .t1{fill:#0550ae;} .mk-c1{fill:#0550ae;}.s2{stroke:#9a4b00;} .f2{fill:#9a4b00;} .t2{fill:#9a4b00;} .mk-c2{fill:#9a4b00;}.s3{stroke:#1a7f37;} .f3{fill:#1a7f37;} .t3{fill:#1a7f37;} .mk-c3{fill:#1a7f37;}.s4{stroke:#6639ba;} .f4{fill:#6639ba;} .t4{fill:#6639ba;} .mk-c4{fill:#6639ba;}.s5{stroke:#a40e26;} .f5{fill:#a40e26;} .t5{fill:#a40e26;} .mk-c5{fill:#a40e26;}@media (prefers-color-scheme: dark){text{fill:#e6edf3;}.sub,.tick,.note{fill:#9198a1;}.axis{stroke:#e6edf3;}.grid,.frame{stroke:#3d444d;}.soft{fill:#21262d;}.mk-ink{fill:#e6edf3;}.s1{stroke:#79c0ff;} .f1{fill:#79c0ff;} .t1{fill:#79c0ff;} .mk-c1{fill:#79c0ff;}.s2{stroke:#f0a35e;} .f2{fill:#f0a35e;} .t2{fill:#f0a35e;} .mk-c2{fill:#f0a35e;}.s3{stroke:#56d364;} .f3{fill:#56d364;} .t3{fill:#56d364;} .mk-c3{fill:#56d364;}.s4{stroke:#d2a8ff;} .f4{fill:#d2a8ff;} .t4{fill:#d2a8ff;} .mk-c4{fill:#d2a8ff;}.s5{stroke:#ff8a8a;} .f5{fill:#ff8a8a;} .t5{fill:#ff8a8a;} .mk-c5{fill:#ff8a8a;}}</style>
<text x="24.00" y="30.00" class="ttl" text-anchor="start">Recovery networks: three protocols on a chain, and the Schwarzian point masses each produces</text>
<text x="24.00" y="50.00" class="sub" text-anchor="start">Source: rigor/network_corner_calculus.tex, Theorem 5.2 (no hypothesis), Theorem 5.3 (junction form, under (H)), Examples ex:displaced and ex:swallow.</text>
<rect x="24.00" y="62.00" width="732.00" height="56.00" rx="4" class="frame"/>
<text x="34.00" y="80.00" class="note" text-anchor="start">Thm 5.2, unconditional:   𝒮(Φ) = −2 Σₘ σₘ Gₘ′(xₘ) δ(xₘ),   Gₘ = kₘ₊₁∘…∘k_N,   xₘ = Gₘ⁻¹(p⁽ᵐ⁾);  a corner with p⁽ᵐ⁾ ∉ Gₘ(J_N) contributes nothing.</text>
<text x="34.00" y="100.00" class="note" text-anchor="start">Thm 5.3, under (H) (no earlier corner in the interior of a later step's moving part):   𝒮(Φ) = −2 Σₖ κₖ δ(pₖ) at the junctions, κₖ = Σ σₘ over the steps with p⁽ᵐ⁾ = pₖ — order independent.</text>
<text x="24.00" y="152.00" class="lab bold t3" text-anchor="start">(a)  single-interval conditioning from a two-interval start — (H) holds, Theorem 5.3 applies</text>
<text x="24.00" y="170.00" class="note" text-anchor="start">chain l = (1.3, 2.1, 0.9, 1.7), start J₀ = A₂A₃.  Step 1: adjoin A₄ on A₃, corner p₃, σ₁ = 1.452991.  Step 2: adjoin A₁ on A₂, corner p₃, σ₂ = 0.364146.</text>
<line x1="164.00" y1="194.00" x2="716.00" y2="194.00" class="axis"/>
<rect x="179.00" y="187.00" width="111.53" height="14.00" rx="2" class="f1"/>
<text x="234.77" y="182.00" class="note" text-anchor="middle">A₁</text>
<rect x="292.53" y="187.00" width="181.40" height="14.00" rx="2" class="f3"/>
<text x="383.23" y="182.00" class="note" text-anchor="middle">A₂</text>
<rect x="475.93" y="187.00" width="76.60" height="14.00" rx="2" class="f1"/>
<text x="514.23" y="182.00" class="note" text-anchor="middle">A₃</text>
<rect x="554.53" y="187.00" width="146.47" height="14.00" rx="2" class="f3"/>
<text x="627.77" y="182.00" class="note" text-anchor="middle">A₄</text>
<line x1="178.00" y1="202.00" x2="178.00" y2="207.00" class="axis"/>
<text x="178.00" y="220.00" class="tick" text-anchor="middle">p1 = 0</text>
<line x1="291.53" y1="202.00" x2="291.53" y2="207.00" class="axis"/>
<text x="291.53" y="220.00" class="tick" text-anchor="middle">p2 = 1.3</text>
<line x1="474.93" y1="202.00" x2="474.93" y2="207.00" class="axis"/>
<text x="474.93" y="220.00" class="tick" text-anchor="middle">p3 = 3.4</text>
<line x1="553.53" y1="202.00" x2="553.53" y2="207.00" class="axis"/>
<text x="553.53" y="220.00" class="tick" text-anchor="middle">p4 = 4.3</text>
<line x1="702.00" y1="202.00" x2="702.00" y2="207.00" class="axis"/>
<text x="702.00" y="220.00" class="tick" text-anchor="middle">p5 = 6</text>
<line x1="164.00" y1="234.00" x2="716.00" y2="234.00" class="grid"/>
<text x="24.00" y="238.00" class="note" text-anchor="start">Schwarzian</text>
<text x="24.00" y="251.00" class="note" text-anchor="start">masses</text>
<line x1="474.93" y1="234.00" x2="474.93" y2="280.00" class="s1" marker-end="url(#ar-c1)"/>
<text x="474.93" y="298.00" class="note t1" text-anchor="middle">−2(σ₁+σ₂) = -3.63427 at p₃ (measured -3.63427)</text>
<text x="24.00" y="292.00" class="note t3" text-anchor="start">Both corners sit at the same junction and the masses add: the corner measure, hence the recovered state, does not depend on the order of the steps.</text>
<text x="24.00" y="316.00" class="lab bold t5" text-anchor="start">(b)  ex:displaced — conditioning on a union moves the mass OFF the junction; (H) fails, only Theorem 5.2 applies</text>
<text x="24.00" y="334.00" class="note" text-anchor="start">same chain, start J₀ = A₂A₃.  Step 1 as above.  Step 2: adjoin A₁ on the UNION A₂A₃, corner p₄, σ₂ = 0.201550.  Then p⁽¹⁾ = p₃ lies in the interior of step 2's moving part.</text>
<line x1="164.00" y1="358.00" x2="716.00" y2="358.00" class="axis"/>
<rect x="179.00" y="351.00" width="111.53" height="14.00" rx="2" class="f1"/>
<text x="234.77" y="346.00" class="note" text-anchor="middle">A₁</text>
<rect x="292.53" y="351.00" width="181.40" height="14.00" rx="2" class="f3"/>
<text x="383.23" y="346.00" class="note" text-anchor="middle">A₂</text>
<rect x="475.93" y="351.00" width="76.60" height="14.00" rx="2" class="f1"/>
<text x="514.23" y="346.00" class="note" text-anchor="middle">A₃</text>
<rect x="554.53" y="351.00" width="146.47" height="14.00" rx="2" class="f3"/>
<text x="627.77" y="346.00" class="note" text-anchor="middle">A₄</text>
<line x1="178.00" y1="366.00" x2="178.00" y2="371.00" class="axis"/>
<text x="178.00" y="384.00" class="tick" text-anchor="middle">p1 = 0</text>
<line x1="291.53" y1="366.00" x2="291.53" y2="371.00" class="axis"/>
<text x="291.53" y="384.00" class="tick" text-anchor="middle">p2 = 1.3</text>
<line x1="474.93" y1="366.00" x2="474.93" y2="371.00" class="axis"/>
<text x="474.93" y="384.00" class="tick" text-anchor="middle">p3 = 3.4</text>
<line x1="553.53" y1="366.00" x2="553.53" y2="371.00" class="axis"/>
<text x="553.53" y="384.00" class="tick" text-anchor="middle">p4 = 4.3</text>
<line x1="702.00" y1="366.00" x2="702.00" y2="371.00" class="axis"/>
<text x="702.00" y="384.00" class="tick" text-anchor="middle">p5 = 6</text>
<line x1="164.00" y1="398.00" x2="716.00" y2="398.00" class="grid"/>
<text x="24.00" y="402.00" class="note" text-anchor="start">Schwarzian</text>
<text x="24.00" y="415.00" class="note" text-anchor="start">masses</text>
<line x1="457.52" y1="398.00" x2="457.52" y2="422.65" class="s5" marker-end="url(#ar-c5)"/>
<text x="457.52" y="440.65" class="note t5" text-anchor="middle">−2σ₁k₂′(x₀) = -1.94734 at x₀ = 3.20057</text>
<line x1="553.53" y1="398.00" x2="553.53" y2="403.10" class="s1" marker-end="url(#ar-c1)"/>
<text x="553.53" y="421.10" class="note t1" text-anchor="middle">−2σ₂ = -0.4031 at p₄</text>
<line x1="474.93" y1="388.00" x2="457.52" y2="388.00" class="grid dash" marker-end="url(#ar-ink)"/>
<text x="466.22" y="383.00" class="note" text-anchor="middle">pulled back by k₂⁻¹, scaled by k₂′(x₀) = 0.670114</text>
<text x="24.00" y="456.00" class="note t5" text-anchor="start">No mass at p₃ (measured 5.4e-05); the total mass is 71% of the naive −2(σ₁+σ₂). The junction form would give the wrong state.</text>
<text x="24.00" y="480.00" class="lab bold t5" text-anchor="start">(c)  ex:swallow — a single-interval start lets a corner be swallowed; (H) fails, only Theorem 5.2 applies</text>
<text x="24.00" y="498.00" class="note" text-anchor="start">chain l = (1, 1, 1), start J₀ = A₂, a SINGLE interval.  Step 1: adjoin A₃ on A₂, corner p₂, σ₁ = 1.  Step 2: adjoin A₁ on A₂, corner p₃, σ₂ = 1.  Both conditioning regions are single intervals.</text>
<line x1="164.00" y1="522.00" x2="716.00" y2="522.00" class="axis"/>
<rect x="179.00" y="515.00" width="172.67" height="14.00" rx="2" class="f1"/>
<text x="265.33" y="510.00" class="note" text-anchor="middle">A₁</text>
<rect x="353.67" y="515.00" width="172.67" height="14.00" rx="2" class="f3"/>
<text x="440.00" y="510.00" class="note" text-anchor="middle">A₂</text>
<rect x="528.33" y="515.00" width="172.67" height="14.00" rx="2" class="f1"/>
<text x="614.67" y="510.00" class="note" text-anchor="middle">A₃</text>
<line x1="178.00" y1="530.00" x2="178.00" y2="535.00" class="axis"/>
<text x="178.00" y="548.00" class="tick" text-anchor="middle">p1 = 0</text>
<line x1="352.67" y1="530.00" x2="352.67" y2="535.00" class="axis"/>
<text x="352.67" y="548.00" class="tick" text-anchor="middle">p2 = 1</text>
<line x1="527.33" y1="530.00" x2="527.33" y2="535.00" class="axis"/>
<text x="527.33" y="548.00" class="tick" text-anchor="middle">p3 = 2</text>
<line x1="702.00" y1="530.00" x2="702.00" y2="535.00" class="axis"/>
<text x="702.00" y="548.00" class="tick" text-anchor="middle">p4 = 3</text>
<line x1="164.00" y1="562.00" x2="716.00" y2="562.00" class="grid"/>
<text x="24.00" y="566.00" class="note" text-anchor="start">Schwarzian</text>
<text x="24.00" y="579.00" class="note" text-anchor="start">masses</text>
<line x1="527.33" y1="562.00" x2="527.33" y2="587.31" class="s1" marker-end="url(#ar-c1)"/>
<text x="527.33" y="605.31" class="note t1" text-anchor="middle">−2σ₂ = -2 at p₃</text>
<text x="352.67" y="578.00" class="lab bold" text-anchor="middle">×</text>
<text x="352.67" y="594.00" class="note" text-anchor="middle">k₂((p₁,p₃)) = (4/3,2) does not contain p₂</text>
<text x="24.00" y="620.00" class="note t5" text-anchor="start">The first corner is outside the range of the later map, so it contributes nothing: Φ = (global Möbius) ∘ k₂ and step 1 leaves the recovered state unchanged.</text>
<text x="24.00" y="626.00" class="note" text-anchor="start">Single-interval conditioning alone does NOT imply (H): panel (c) is a counterexample. The sufficient condition is single-interval conditioning AND a starting block of at least two chain intervals (Prop. H-suff(a)).</text>
</svg>
