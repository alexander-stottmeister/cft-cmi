<text x="24.00" y="30.00" class="ttl" text-anchor="start">Recovery networks: three protocols on a chain, and the Schwarzian point masses each produces</text>
<text x="24.00" y="48.00" class="sub" text-anchor="start">Source: rigor/network_corner_calculus.tex — Thm 5.2 (unconditional), Thm 5.3 (junction form, under (H)); Examples ex:displaced, ex:swallow.</text>
<rect x="24.00" y="58.00" width="732.00" height="62.00" rx="4" class="frame"/>
<text x="34.00" y="76.00" class="note" text-anchor="start">Thm 5.2, unconditional:   𝒮(Φ) = −2 Σₘ σₘ Gₘ′(xₘ) δ(xₘ),   Gₘ = kₘ₊₁∘…∘k_N,   xₘ = Gₘ⁻¹(p⁽ᵐ⁾);</text>
<text x="34.00" y="92.00" class="note" text-anchor="start">a corner with p⁽ᵐ⁾ ∉ Gₘ(J_N) contributes nothing.  Thm 5.3, under (H) — no earlier corner in the interior of a later step's moving part:</text>
<text x="34.00" y="108.00" class="note" text-anchor="start">𝒮(Φ) = −2 Σₖ κₖ δ(pₖ) at the junctions, κₖ = Σ σₘ over the steps with p⁽ᵐ⁾ = pₖ — so the corner measure is order independent.</text>
<text x="24.00" y="146.00" class="lab bold t3" text-anchor="start">(a)  single-interval conditioning from a two-interval start — (H) holds, Theorem 5.3 applies</text>
<text x="24.00" y="161.00" class="note" text-anchor="start">chain l = (1.3, 2.1, 0.9, 1.7), start J₀ = A₂A₃.  Step 1: adjoin A₄ conditioning on A₃, corner p₃, σ₁ = 1.452991.</text>
<text x="24.00" y="175.00" class="note" text-anchor="start">Step 2: adjoin A₁ conditioning on A₂ alone, corner p₃ again, σ₂ = 0.364146.</text>
<text x="24.00" y="191.00" class="note t3" text-anchor="start">Both corners sit at the same junction and the masses add; the corner measure, hence the recovered state, is order independent.</text>
<line x1="166.00" y1="216.00" x2="718.00" y2="216.00" class="axis"/>
<rect x="183.00" y="209.00" width="110.67" height="14.00" rx="2" class="f1"/>
<text x="238.33" y="204.00" class="note" text-anchor="middle">A₁</text>
<rect x="295.67" y="209.00" width="180.00" height="14.00" rx="2" class="f3"/>
<text x="385.67" y="204.00" class="note" text-anchor="middle">A₂</text>
<rect x="477.67" y="209.00" width="76.00" height="14.00" rx="2" class="f1"/>
<text x="515.67" y="204.00" class="note" text-anchor="middle">A₃</text>
<rect x="555.67" y="209.00" width="145.33" height="14.00" rx="2" class="f3"/>
<text x="628.33" y="204.00" class="note" text-anchor="middle">A₄</text>
<line x1="182.00" y1="224.00" x2="182.00" y2="229.00" class="axis"/>
<text x="182.00" y="240.00" class="tick" text-anchor="middle">p₁ = 0</text>
<line x1="294.67" y1="224.00" x2="294.67" y2="229.00" class="axis"/>
<text x="294.67" y="240.00" class="tick" text-anchor="middle">p₂ = 1.3</text>
<line x1="476.67" y1="224.00" x2="476.67" y2="229.00" class="axis"/>
<text x="476.67" y="240.00" class="tick" text-anchor="middle">p₃ = 3.4</text>
<line x1="554.67" y1="224.00" x2="554.67" y2="229.00" class="axis"/>
<text x="554.67" y="240.00" class="tick" text-anchor="middle">p₄ = 4.3</text>
<line x1="702.00" y1="224.00" x2="702.00" y2="229.00" class="axis"/>
<text x="702.00" y="240.00" class="tick" text-anchor="middle">p₅ = 6</text>
<line x1="166.00" y1="264.00" x2="718.00" y2="264.00" class="grid"/>
<text x="24.00" y="265.00" class="note" text-anchor="start">Schwarzian</text>
<text x="24.00" y="278.00" class="note" text-anchor="start">masses</text>
<line x1="476.67" y1="264.00" x2="476.67" y2="308.00" class="s1" marker-end="url(#ar-c1)"/>
<text x="476.67" y="324.00" class="note t1" text-anchor="middle">−2(σ₁+σ₂) = −3.634274 at p₃  (measured −3.634266)</text>
<text x="24.00" y="354.00" class="lab bold t5" text-anchor="start">(b)  ex:displaced — conditioning on a union moves the mass OFF the junction; (H) fails, only Theorem 5.2 applies</text>
<text x="24.00" y="369.00" class="note" text-anchor="start">same chain, start J₀ = A₂A₃.  Step 1 as in (a).  Step 2: adjoin A₁ conditioning on the UNION A₂A₃, corner p₄, σ₂ = 0.201550.</text>
<text x="24.00" y="383.00" class="note" text-anchor="start">The earlier corner p₃ then lies in the interior of step 2's moving part, so (H) fails and the junction form does not apply.</text>
<text x="24.00" y="399.00" class="note t5" text-anchor="start">No mass at p₃ (measured 5.4e-05); the total is 71% of the naive −2(σ₁+σ₂). The junction form would give the wrong state.</text>
<line x1="166.00" y1="424.00" x2="718.00" y2="424.00" class="axis"/>
<rect x="183.00" y="417.00" width="110.67" height="14.00" rx="2" class="f1"/>
<text x="238.33" y="412.00" class="note" text-anchor="middle">A₁</text>
<rect x="295.67" y="417.00" width="180.00" height="14.00" rx="2" class="f3"/>
<text x="385.67" y="412.00" class="note" text-anchor="middle">A₂</text>
<rect x="477.67" y="417.00" width="76.00" height="14.00" rx="2" class="f1"/>
<text x="515.67" y="412.00" class="note" text-anchor="middle">A₃</text>
<rect x="555.67" y="417.00" width="145.33" height="14.00" rx="2" class="f3"/>
<text x="628.33" y="412.00" class="note" text-anchor="middle">A₄</text>
<line x1="182.00" y1="432.00" x2="182.00" y2="437.00" class="axis"/>
<text x="182.00" y="448.00" class="tick" text-anchor="middle">p₁ = 0</text>
<line x1="294.67" y1="432.00" x2="294.67" y2="437.00" class="axis"/>
<text x="294.67" y="448.00" class="tick" text-anchor="middle">p₂ = 1.3</text>
<line x1="476.67" y1="432.00" x2="476.67" y2="437.00" class="axis"/>
<text x="476.67" y="448.00" class="tick" text-anchor="middle">p₃ = 3.4</text>
<line x1="554.67" y1="432.00" x2="554.67" y2="437.00" class="axis"/>
<text x="554.67" y="448.00" class="tick" text-anchor="middle">p₄ = 4.3</text>
<line x1="702.00" y1="432.00" x2="702.00" y2="437.00" class="axis"/>
<text x="702.00" y="448.00" class="tick" text-anchor="middle">p₅ = 6</text>
<line x1="166.00" y1="472.00" x2="718.00" y2="472.00" class="grid"/>
<text x="24.00" y="473.00" class="note" text-anchor="start">Schwarzian</text>
<text x="24.00" y="486.00" class="note" text-anchor="start">masses</text>
<line x1="459.38" y1="472.00" x2="459.38" y2="495.58" class="s5" marker-end="url(#ar-c5)"/>
<text x="459.38" y="511.58" class="note t5" text-anchor="middle">−2σ₁k₂′(x₀) = −1.947339 at x₀ = 3.20057</text>
<line x1="554.67" y1="472.00" x2="554.67" y2="476.88" class="s1" marker-end="url(#ar-c1)"/>
<text x="554.67" y="492.88" class="note t1" text-anchor="middle">−2σ₂ = −0.4031 at p₄</text>
<line x1="476.67" y1="464.00" x2="459.38" y2="464.00" class="grid dash" marker-end="url(#ar-ink)"/>
<text x="437.38" y="468.00" class="note" text-anchor="end">pulled back by k₂⁻¹, scaled by k₂′(x₀) = 0.670114</text>
<text x="24.00" y="562.00" class="lab bold t5" text-anchor="start">(c)  ex:swallow — a single-interval start lets a corner be swallowed; (H) fails, only Theorem 5.2 applies</text>
<text x="24.00" y="577.00" class="note" text-anchor="start">chain l = (1, 1, 1), start J₀ = A₂, a SINGLE interval.  Step 1: adjoin A₃ on A₂, corner p₂, σ₁ = 1.</text>
<text x="24.00" y="591.00" class="note" text-anchor="start">Step 2: adjoin A₁ on A₂, corner p₃, σ₂ = 1.  Both conditioning regions are single chain intervals, yet (H) fails.</text>
<text x="24.00" y="607.00" class="note t5" text-anchor="start">The first corner is outside the range of the later map, so it contributes nothing: Φ = (global Möbius) ∘ k₂, and step 1 changes nothing.</text>
<line x1="166.00" y1="632.00" x2="718.00" y2="632.00" class="axis"/>
<rect x="183.00" y="625.00" width="171.33" height="14.00" rx="2" class="f1"/>
<text x="268.67" y="620.00" class="note" text-anchor="middle">A₁</text>
<rect x="356.33" y="625.00" width="171.33" height="14.00" rx="2" class="f3"/>
<text x="442.00" y="620.00" class="note" text-anchor="middle">A₂</text>
<rect x="529.67" y="625.00" width="171.33" height="14.00" rx="2" class="f1"/>
<text x="615.33" y="620.00" class="note" text-anchor="middle">A₃</text>
<line x1="182.00" y1="640.00" x2="182.00" y2="645.00" class="axis"/>
<text x="182.00" y="656.00" class="tick" text-anchor="middle">p₁ = 0</text>
<line x1="355.33" y1="640.00" x2="355.33" y2="645.00" class="axis"/>
<text x="355.33" y="656.00" class="tick" text-anchor="middle">p₂ = 1</text>
<line x1="528.67" y1="640.00" x2="528.67" y2="645.00" class="axis"/>
<text x="528.67" y="656.00" class="tick" text-anchor="middle">p₃ = 2</text>
<line x1="702.00" y1="640.00" x2="702.00" y2="645.00" class="axis"/>
<text x="702.00" y="656.00" class="tick" text-anchor="middle">p₄ = 3</text>
<line x1="166.00" y1="680.00" x2="718.00" y2="680.00" class="grid"/>
<text x="24.00" y="681.00" class="note" text-anchor="start">Schwarzian</text>
<text x="24.00" y="694.00" class="note" text-anchor="start">masses</text>
<line x1="528.67" y1="680.00" x2="528.67" y2="704.21" class="s1" marker-end="url(#ar-c1)"/>
<text x="528.67" y="720.21" class="note t1" text-anchor="middle">−2σ₂ = −2 at p₃</text>
<text x="355.33" y="696.00" class="lab bold" text-anchor="middle">×</text>
<text x="355.33" y="672.00" class="note" text-anchor="middle">swallowed: k₂((p₁,p₃)) = (4/3,2) does not contain p₂</text>
<text x="24.00" y="738.00" class="note" text-anchor="start">Single-interval conditioning alone does NOT imply (H): panel (c) is a counterexample. The sufficient condition is single-interval conditioning</text>
<text x="24.00" y="754.00" class="note" text-anchor="start">AND a starting block of at least two chain intervals (Prop. H-suff(a)). Implementing only the junction form would teach a false theorem.</text>
</svg>
