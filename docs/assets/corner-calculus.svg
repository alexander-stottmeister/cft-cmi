<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 648" width="780" height="648" role="img" aria-labelledby="t d">
<title id="t">The corner calculus: three protocols and their Schwarzian masses</title>
<desc id="d">Theorem 5.2 places a mass at the preimage of each junction scaled by the later maps' derivatives; Theorem 5.3 is the junction form, which holds under hypothesis (H).</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="mk-ink"/></marker><marker id="ar-c1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="mk-c1"/></marker><marker id="ar-c2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="mk-c2"/></marker><marker id="ar-c3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="mk-c3"/></marker><marker id="ar-c4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="mk-c4"/></marker><marker id="ar-c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="mk-c5"/></marker></defs>
