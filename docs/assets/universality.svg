<text x="24.00" y="30.00" class="ttl" text-anchor="start">Theorem B: the second-order coefficient is linear in c, and three models measure it at c = 1</text>
<text x="24.00" y="50.00" class="sub" text-anchor="start">The straight line is a theorem, not a fit: no measurement away from c = 1 exists, and none is scaled along the line.</text>
