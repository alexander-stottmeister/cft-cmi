<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 432" width="780" height="432" role="img" aria-labelledby="t d">
<title id="t">Three adjacent intervals and the zero-collar recovery map</title>
<desc id="d">Schematic of A, B, C on the chiral line, the collar between A and B, and the geometric compression that recovers ABC from AB.</desc>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="mk-ink"/></marker><marker id="ar-c1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="mk-c1"/></marker><marker id="ar-c2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="mk-c2"/></marker><marker id="ar-c3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="mk-c3"/></marker><marker id="ar-c4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="mk-c4"/></marker><marker id="ar-c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="mk-c5"/></marker></defs>
<style>
  text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI",
         Helvetica, Arial, sans-serif; font-size: 12px; }
  .ttl { font-size: 16px; font-weight: 600; }
  .sub, .tick, .note { font-size: 11px; }
  .lab { font-size: 12px; }
  .bold { font-weight: 600; }
  .axis { stroke-width: 1.2; fill: none; }
  .grid, .frame { stroke-width: 1; fill: none; }
  .soft { stroke: none; }
  .s1, .s2, .s3, .s4, .s5 { fill: none; stroke-width: 2; }
  .f1, .f2, .f3, .f4, .f5 { stroke: none; }
  .hole { fill: none; stroke-width: 2; }
  .dash { stroke-dasharray: 6 4; }
  .dot { stroke-dasharray: 2 3; }
text{fill:#1f2328;}.sub,.tick,.note{fill:#57606a;}.axis{stroke:#1f2328;}.grid,.frame{stroke:#d0d7de;}.soft{fill:#eaeef2;}.mk-ink{fill:#1f2328;}.s1{stroke:#0550ae;} .f1{fill:#0550ae;} .t1{fill:#0550ae;} .mk-c1{fill:#0550ae;}.s2{stroke:#9a4b00;} .f2{fill:#9a4b00;} .t2{fill:#9a4b00;} .mk-c2{fill:#9a4b00;}.s3{stroke:#1a7f37;} .f3{fill:#1a7f37;} .t3{fill:#1a7f37;} .mk-c3{fill:#1a7f37;}.s4{stroke:#6639ba;} .f4{fill:#6639ba;} .t4{fill:#6639ba;} .mk-c4{fill:#6639ba;}.s5{stroke:#a40e26;} .f5{fill:#a40e26;} .t5{fill:#a40e26;} .mk-c5{fill:#a40e26;}@media (prefers-color-scheme: dark){text{fill:#e6edf3;}.sub,.tick,.note{fill:#9198a1;}.axis{stroke:#e6edf3;}.grid,.frame{stroke:#3d444d;}.soft{fill:#21262d;}.mk-ink{fill:#e6edf3;}.s1{stroke:#79c0ff;} .f1{fill:#79c0ff;} .t1{fill:#79c0ff;} .mk-c1{fill:#79c0ff;}.s2{stroke:#f0a35e;} .f2{fill:#f0a35e;} .t2{fill:#f0a35e;} .mk-c2{fill:#f0a35e;}.s3{stroke:#56d364;} .f3{fill:#56d364;} .t3{fill:#56d364;} .mk-c3{fill:#56d364;}.s4{stroke:#d2a8ff;} .f4{fill:#d2a8ff;} .t4{fill:#d2a8ff;} .mk-c4{fill:#d2a8ff;}.s5{stroke:#ff8a8a;} .f5{fill:#ff8a8a;} .t5{fill:#ff8a8a;} .mk-c5{fill:#ff8a8a;}}</style>
<text x="24.00" y="30.00" class="ttl" text-anchor="start">Three adjacent intervals, the collar, and the compression that recovers ABC from AB</text>
<text x="24.00" y="50.00" class="sub" text-anchor="start">Schematic, no data. Drawn at a = b = c = 1, so L = b+c = 2 and s = λ = c/b = 1.</text>
<text x="24.00" y="66.00" class="sub" text-anchor="start">Geometry, maps and ζ from continuum_petz_free_fermion.tex (Note 4); CMI from adjacent_interval_cmi_longo_xu.tex (Note 1).</text>
<text x="24.00" y="104.00" class="note" text-anchor="start">vacuum on the line</text>
<line x1="6.00" y1="148.00" x2="698.00" y2="148.00" class="axis"/>
<rect x="50.00" y="139.00" width="200.00" height="18.00" rx="3" class="f1"/>
<text x="150.00" y="132.00" class="lab bold t1" text-anchor="middle">A</text>
<rect x="250.00" y="139.00" width="200.00" height="18.00" rx="3" class="f3"/>
<text x="350.00" y="132.00" class="lab bold t3" text-anchor="middle">B</text>
<rect x="450.00" y="139.00" width="200.00" height="18.00" rx="3" class="f2"/>
<text x="550.00" y="132.00" class="lab bold t2" text-anchor="middle">C</text>
<line x1="50.00" y1="158.00" x2="50.00" y2="163.00" class="axis"/>
<text x="50.00" y="176.00" class="tick" text-anchor="middle">−a = −1</text>
<line x1="250.00" y1="158.00" x2="250.00" y2="163.00" class="axis"/>
<text x="250.00" y="176.00" class="tick" text-anchor="middle">0</text>
<line x1="450.00" y1="158.00" x2="450.00" y2="163.00" class="axis"/>
<text x="450.00" y="176.00" class="tick" text-anchor="middle">b = 1</text>
<line x1="650.00" y1="158.00" x2="650.00" y2="163.00" class="axis"/>
<text x="650.00" y="176.00" class="tick" text-anchor="middle">b+c = L = 2</text>
<rect x="206.00" y="135.00" width="44.00" height="26.00" rx="2" class="frame dash"/>
<text x="228.00" y="128.00" class="note" text-anchor="middle">collar ε</text>
<line x1="350.00" y1="192.00" x2="330.00" y2="262.00" class="grid dot" marker-end="url(#ar-ink)"/>
<line x1="450.00" y1="192.00" x2="383.33" y2="262.00" class="grid dot" marker-end="url(#ar-ink)"/>
<line x1="550.00" y1="192.00" x2="421.43" y2="262.00" class="grid dot" marker-end="url(#ar-ink)"/>
<line x1="650.00" y1="192.00" x2="450.00" y2="262.00" class="grid dot" marker-end="url(#ar-ink)"/>
<text x="606.00" y="226.00" class="note bold" text-anchor="start">compression kₛ</text>
<text x="24.00" y="238.00" class="note" text-anchor="start">after the compression kₛ</text>
<line x1="6.00" y1="292.00" x2="698.00" y2="292.00" class="axis"/>
<rect x="50.00" y="283.00" width="200.00" height="18.00" rx="3" class="f1"/>
<text x="150.00" y="276.00" class="lab bold t1" text-anchor="middle">A (fixed)</text>
<rect x="250.00" y="283.00" width="133.33" height="18.00" rx="3" class="f3"/>
<text x="316.67" y="276.00" class="lab bold t3" text-anchor="middle">hₛ(B)</text>
<rect x="383.33" y="283.00" width="66.67" height="18.00" rx="3" class="f2"/>
<text x="416.67" y="276.00" class="lab bold t2" text-anchor="middle">hₛ(C)</text>
<line x1="50.00" y1="302.00" x2="50.00" y2="307.00" class="axis"/>
<text x="50.00" y="320.00" class="tick" text-anchor="middle">−1</text>
<line x1="250.00" y1="302.00" x2="250.00" y2="307.00" class="axis"/>
<text x="250.00" y="320.00" class="tick" text-anchor="middle">0</text>
<line x1="383.33" y1="302.00" x2="383.33" y2="307.00" class="axis"/>
<text x="383.33" y="320.00" class="tick" text-anchor="middle">0.667</text>
<line x1="450.00" y1="302.00" x2="450.00" y2="307.00" class="axis"/>
<text x="450.00" y="320.00" class="tick" text-anchor="middle">1 = b</text>
<circle cx="250.00" cy="292.00" r="4.50" class="f5"/>
<text x="244.00" y="256.00" class="note t5" text-anchor="end">corner p = 0</text>
<line x1="246.00" y1="260.00" x2="250.00" y2="285.00" class="grid"/>
<text x="480.00" y="272.00" class="note" text-anchor="start">the whole of BC now sits inside B</text>
<text x="24.00" y="348.00" class="note" text-anchor="start">recovery map (Note 4):  kₛ = id on A,  hₛ(x) = Lx/(L+sx) on D = BC;  at s = λ = c/b its range is exactly A(B).</text>
<text x="24.00" y="367.00" class="note" text-anchor="start">corner p = 0:  Schwarzian mass −2σ = −1 with σ = s/L = 0.5;  strength ζ = as/(a+L) = 0.3333;  Theorem A measures Φ(ζ) = −log F.</text>
<text x="24.00" y="386.00" class="note" text-anchor="start">collar:  ε &gt; 0 gives the split product state FHSW needs; at ε = 0 there is none, and the channel is a unique normal extension.</text>
<text x="24.00" y="405.00" class="note" text-anchor="start">Longo–Xu CMI:  I(A:C|B) = (c/6)·log[(a+b)(b+c)/(b(a+b+c))] = (c/6)·log(4/3) = 0.0479·c.</text>
</svg>
