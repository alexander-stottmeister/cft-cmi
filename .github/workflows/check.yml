name: check

# Every generated artefact must still match its source, the two papers must still
# build, and docs/ is deployed to Pages.  Decision D1's three conditions were met
# on 2026-09-22: the repository went public, Pages was enabled with this workflow
# as its build type, and the `if: false` below was removed.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  generated-artefacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: documentation matches the knowledge base
        # The knowledge base is a separate private repository, so the generator
        # cannot run here.  What CI can check is that the committed pages are
        # internally consistent and that nothing links outside the repository.
        run: python3 tools/check_links.py
      - name: site data matches its source files
        # --allow-missing-kb drops the claim map, the one payload built from the
        # knowledge base, which is a separate private repository this runner does
        # not have.  The other three come from result files in this repository and
        # are checked here; the skipped file is named in the log.
        run: |
          python3 tools/build_site_data.py --check
          python3 tools/build_site_data_extra.py --check --allow-missing-kb
      - name: figures are reproducible
        run: |
          python3 tools/make_figures.py
          git diff --exit-code -- docs/assets

  papers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: TeX Live
        # --no-install-recommends suppresses Recommends, not Depends, so texlive-pictures
        # arrives anyway as a Depends of texlive-latex-extra and is named here only for
        # the record.  lmodern is the one package that had to be added: it carries
        # lmodern.sty, which paper1/main.tex, paper2/main.tex and rigor_preamble.tex all
        # load on line 2, and its absence is what failed every papers job until the repair
        # of 2026-09-21 (the other job failed independently, on the claim map).  Commit hashes
        # from before that day name a history that no longer exists: the remote was deleted
        # and recreated to clear the objects an earlier rewrite had left recoverable.
        # fonts-lmodern is not a substitute; it ships fonts and no .sty.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-recommended texlive-latex-extra texlive-science \
            texlive-fonts-recommended texlive-pictures lmodern
      - name: the two papers build
        run: make papers
      - name: the rigor documents that are expected to build still do
        run: python3 tools/check_rigor_builds.py

  # Live since 2026-09-22.  Pages was enabled out of band, by a REST call with a user
  # token: configure-pages has an `enablement` input, but its own action.yml says it
  # needs a token other than GITHUB_TOKEN, because creating the site requires
  # Administration (write), which is not a key of the workflow `permissions:` schema.
  # So this job deploys an existing site and cannot create one; if Pages is ever turned
  # off, turning it back on is a REST call or a click, not a change here.
  pages:
    runs-on: ubuntu-latest
    permissions: { pages: write, id-token: write }
    environment: { name: github-pages, url: '${{ steps.deploy.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: docs }
      - id: deploy
        uses: actions/deploy-pages@v4
